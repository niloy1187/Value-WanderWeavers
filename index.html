        // --- AUDIO ENGINE ---
        class AudioCore {
            constructor() {
                this.ctx = null;
                this.isPlaying = false;
            }
            
            init() {
                if (this.ctx) return;
                const Ctx = window.AudioContext || window.webkitAudioContext;
                this.ctx = new Ctx();
                
                // Signal Chain
                this.master = this.ctx.createGain();
                this.master.gain.value = 0.8;
                
                // Dynamics
                const comp = this.ctx.createDynamicsCompressor();
                this.master.connect(comp);
                comp.connect(this.ctx.destination);
                
                // SFX Bus
                this.sfxBus = this.ctx.createGain();
                this.sfxBus.gain.value = 0.9;
                this.sfxBus.connect(this.master);
                
                // BGM Bus
                this.bgmBus = this.ctx.createGain();
                this.bgmBus.gain.value = 0.35; // Cinematic Level
                this.bgmBus.connect(this.master);
                
                // Sidechain Ducking
                this.ducker = this.ctx.createGain();
                this.bgmBus.connect(this.ducker); 
                // Note: simplified ducking logic implemented in playSFX
            }

            startBGM() {
                if (!this.ctx || this.isPlaying) return;
                this.isPlaying = true;
                this.playDrone();
            }

            playDrone() {
                // Reese Bass Drone
                const osc1 = this.ctx.createOscillator();
                const osc2 = this.ctx.createOscillator();
                osc1.type = 'sawtooth';
                osc2.type = 'sawtooth';
                
                // Chord: A Minor 9
                osc1.frequency.value = 55; // A1
                osc2.frequency.value = 55.5; // Detuned
                
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.Q.value = 5;
                
                // LFO for Filter
                const lfo = this.ctx.createOscillator();
                lfo.type = 'sine';
                lfo.frequency.value = 0.2; // Slow breathe
                const lfoGain = this.ctx.createGain();
                lfoGain.gain.value = 500;
                
                lfo.connect(lfoGain);
                lfoGain.connect(filter.frequency);
                filter.frequency.value = 800;
                
                const gain = this.ctx.createGain();
                gain.gain.value = 0.4;
                
                osc1.connect(filter);
                osc2.connect(filter);
                filter.connect(gain);
                gain.connect(this.bgmBus);
                
                osc1.start();
                osc2.start();
                lfo.start();
                
                // Add High Pad Texture
                const pad = this.ctx.createOscillator();
                pad.type = 'triangle';
                pad.frequency.value = 220; // A3
                const padGain = this.ctx.createGain();
                padGain.gain.value = 0.05;
                pad.connect(padGain);
                padGain.connect(this.bgmBus);
                pad.start();
            }

            playSFX(type) {
                if (!this.ctx) return;
                if (this.ctx.state === 'suspended') this.ctx.resume();
                
                const t = this.ctx.currentTime;
                
                // Duck BGM
                this.bgmBus.gain.setTargetAtTime(0.1, t, 0.1);
                this.bgmBus.gain.setTargetAtTime(0.35, t + 0.5, 0.5);

                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.sfxBus);

                if (type === 'hover') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, t);
                    osc.frequency.exponentialRampToValueAtTime(800, t + 0.05);
                    gain.gain.setValueAtTime(0.1, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
                    osc.start(t);
                    osc.stop(t + 0.05);
                } else if (type === 'click') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(200, t);
                    osc.frequency.exponentialRampToValueAtTime(50, t + 0.1);
                    gain.gain.setValueAtTime(0.3, t);
                    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
                    osc.start(t);
                    osc.stop(t + 0.1);
                } else if (type === 'boot') {
                     // Noise burst
                     const bufferSize = this.ctx.sampleRate * 2;
                     const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                     const data = buffer.getChannelData(0);
                     for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
                     const noise = this.ctx.createBufferSource();
                     noise.buffer = buffer;
                     const nGain = this.ctx.createGain();
                     nGain.gain.setValueAtTime(0.5, t);
                     nGain.gain.exponentialRampToValueAtTime(0.001, t + 1);
                     noise.connect(nGain);
                     nGain.connect(this.sfxBus);
                     noise.start(t);
                } else if (type === 'success') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, t);
                    osc.frequency.setValueAtTime(554, t + 0.1); // C#
                    osc.frequency.setValueAtTime(659, t + 0.2); // E
                    gain.gain.setValueAtTime(0.2, t);
                    gain.gain.linearRampToValueAtTime(0, t + 0.5);
                    osc.start(t);
                    osc.stop(t + 0.5);
                }
            }
        }

                                 <div className="text-[9px] text-gray-500 uppercase tracking-widest hidden md:block">TIME</div>
                                 <div className="font-mono text-white text-sm md:text-xl">{time}</div>
                             </div>
                        </div>
                    </div>
                    
                    {/* TICKER */}
                    <div className="ticker-wrap">
                        <div className="ticker-move">
                            {tickers.map((t, i) => <span key={i} className="ticker-item">{t} +++ </span>)}
                            {tickers.map((t, i) => <span key={'d'+i} className="ticker-item">{t} +++ </span>)}
                        </div>
                    </div>
                </header>
            )
        };

        const Sidebar = ({ active, onNav, onDeal, onConsole }) => {
            return (
                <nav className="hidden md:flex w-64 bg-panel border-r border-gray-800 flex-col h-full relative z-30 shrink-0">
                    <div className="p-6 border-b border-gray-800">
                        <div className="text-[10px] font-hud text-neon-gold tracking-widest">TACTICAL NAV</div>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-2">
                        <button 
                            onClick={onDeal}
                            className="w-full text-left p-4 mb-6 border-2 border-neon-gold text-neon-gold font-hud text-xs font-bold tracking-widest hover:bg-neon-gold hover:text-black transition-all clip-corner-br"
                            onMouseEnter={() => audio.playSFX('hover')}
                        >
                            DEAL FINDER »
                        </button>
                        
                        <div className="text-[9px] text-gray-600 font-mono mb-2 px-2">SECTORS</div>
                        <button onClick={() => onNav('map')} className={`w-full text-left p-3 text-xs font-hud border-l-2 transition-all ${active === 'map' ? 'border-neon-cyan text-white bg-white/5' : 'border-transparent text-gray-500 hover:text-white'}`} onMouseEnter={() => audio.playSFX('hover')}>GLOBAL MAP</button>
                        
                        {SECTORS.map(s => (
                            <button 
                                key={s} 
                                onClick={() => onNav(s)}
                                onMouseEnter={() => audio.playSFX('hover')}
                                className={`w-full text-left p-3 text-xs font-hud border-l-2 uppercase transition-all ${active === s ? 'border-neon-gold text-neon-gold bg-white/5' : 'border-transparent text-gray-500 hover:text-white'}`}
                            >
                                {s}
                            </button>
                        ))}
                    </div>
                    <div className="p-4 border-t border-gray-800">
                        <button onClick={onConsole} className="w-full py-2 text-[10px] font-mono text-gray-500 border border-dashed border-gray-800 hover:text-neon-cyan hover:border-neon-cyan transition-colors">TOGGLE LOGS</button>
                    </div>
                </nav>
            )
        };

        const MobileNav = ({ onNav, onDeal }) => (
            <div className="md:hidden fixed bottom-4 left-4 right-4 h-16 bg-panel/95 backdrop-blur border border-neon-cyan/50 rounded-lg flex z-50 shadow-2xl overflow-hidden">
                <button onClick={() => onNav('map')} className="flex-1 flex flex-col items-center justify-center border-r border-gray-800 text-gray-400 active:text-neon-cyan">
                    <span className="text-xl">⦿</span><span className="text-[9px] font-hud mt-1">MAP</span>
                </button>
                <button onClick={onDeal} className="flex-1 flex flex-col items-center justify-center border-r border-gray-800 text-neon-gold active:text-white">
                    <span className="text-xl">⚡</span><span className="text-[9px] font-hud mt-1">DEALS</span>
                </button>
                <button onClick={() => onNav('goa')} className="flex-1 flex flex-col items-center justify-center text-gray-400 active:text-neon-cyan">
                    <span className="text-xl">Ξ</span><span className="text-[9px] font-hud mt-1">LIST</span>
                </button>
            </div>
        );

        const PackageGrid = ({ data, onBook, clearance, onUnlock }) => {
            const [expanded, setExpanded] = useState({});

            const toggle = (idx) => {
                audio.playSFX('click');
                setExpanded(prev => ({...prev, [idx]: !prev[idx]}));
            }

            return (
                <div className="w-full pb-24">
                    <div className="mb-8 p-6 bg-gradient-to-r from-panel to-transparent border-l-4 border-neon-gold">
                        <h2 className="text-3xl md:text-5xl font-display font-bold text-white mb-2">{data.title.split(':')[1]}</h2>
                        <p className="font-hud text-xs md:text-sm text-gray-400 tracking-widest uppercase">{data.subtitle}</p>
                    </div>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        {data.missions.map((pkg, idx) => (
                            <div key={idx} className="bg-panel border border-gray-800 hover:border-neon-gold transition-all group animate-fade-in-up" onMouseEnter={() => audio.playSFX('hover')}>
                                <div className="h-48 relative overflow-hidden">
                                    <img src={pkg.media[0].src} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110 filter brightness-75 group-hover:brightness-100" />
                                    <div className="absolute top-2 right-2 bg-black/80 px-2 py-1 text-[10px] font-hud text-white border border-gray-600">{pkg.threat} THREAT</div>
                                </div>
                                <div className="p-5">
                                    <h3 className="font-hud text-lg text-white mb-1">{pkg.codename}</h3>
                                    <div className="font-mono text-xl text-neon-gold mb-4">{pkg.price}</div>
                                    <div className="grid grid-cols-2 gap-2 mb-4">
                                        <div className="bg-black/50 p-2 border border-gray-800"><div className="text-[9px] text-gray-500">VFM</div><div className="text-green-400 text-sm font-bold font-mono">{pkg.vfm}</div></div>
                                        <div className="bg-black/50 p-2 border border-gray-800"><div className="text-[9px] text-gray-500">TIME</div><div className="text-white text-sm font-bold font-mono">{pkg.duration}</div></div>
                                    </div>
                                    <p className="text-xs text-gray-400 font-mono mb-4 leading-relaxed">{pkg.brief}</p>
                                    
                                    <button onClick={() => onBook(pkg)} className="w-full py-3 bg-neon-gold text-black font-hud font-bold text-xs tracking-widest hover:bg-white mb-2 clip-corner-br shadow-[0_0_15px_rgba(255,215,0,0.2)]">BOOK MISSION</button>
                                    <button onClick={() => toggle(idx)} className="w-full py-2 text-[10px] font-mono text-gray-500 hover:text-neon-cyan uppercase">{expanded[idx] ? '[-] HIDE INTEL' : '[+] EXPAND DOSSIER'}</button>
                                    
                                    {expanded[idx] && (
                                        <div className="mt-4 pt-4 border-t border-gray-800 space-y-2">
                                            {pkg.inclusions.map((inc, i) => (
                                                <div key={i} className="flex gap-2 text-xs text-gray-300 font-mono"><span className="text-neon-gold">»</span>{inc}</div>
                                            ))}
                                            {pkg.lockedInclusions.map((inc, i) => (
                                                <div 
                                                    key={'l'+i} 
                                                    onClick={() => clearance === 'RECRUIT' && onUnlock(pkg)}
                                                    className={`flex gap-2 text-xs font-mono relative overflow-hidden ${clearance === 'RECRUIT' ? 'cursor-pointer group/lock' : ''}`}
                                                >
                                                    <span className={clearance === 'AGENT' ? 'text-neon-cyan' : 'text-neon-red'}>{clearance === 'AGENT' ? '🔓' : '🔒'}</span>
                                                    {clearance === 'AGENT' ? <span className="text-neon-cyan shadow-glow">{inc}</span> : (
                                                        <div className="relative w-full">
                                                            <span className="blur-text opacity-50">{inc}</span>
                                                            <div className="absolute inset-0 flex items-center bg-black/80 border border-neon-red/30"><span className="mx-auto text-[9px] text-neon-red tracking-widest">ACCESS DENIED</span></div>
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            )
        };

        const IndiaMap = ({ onSectorSelect }) => {
            const mapRef = useRef(null);
            
            useEffect(() => {
                if(!mapRef.current) return;
                const map = L.map(mapRef.current, { zoomControl: false, attributionControl: false, scrollWheelZoom: false }).setView([22.5, 79.0], window.innerWidth < 768 ? 4 : 5);
                
                L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

                const coords = {
                    goa: [15.4909, 73.8278],
                    himachal: [32.2432, 77.1892],
                    rajasthan: [26.9124, 75.7873],
                    kerala: [9.9312, 76.2673],
                    uttarakhand: [30.3165, 78.0322],
                    karnataka: [15.3350, 76.4600],
                    meghalaya: [25.5788, 91.8933]
                };

                Object.entries(coords).forEach(([key, val]) => {
                     const icon = L.divIcon({
                        className: 'bg-transparent',
                        html: `<div class="relative flex items-center justify-center w-12 h-12 -translate-x-1/2 -translate-y-1/2 group cursor-pointer"><div class="radar-ring"></div><div class="radar-marker"></div><div class="absolute top-8 bg-black border border-neon-cyan px-2 py-1 text-[9px] font-mono text-neon-cyan uppercase opacity-0 group-hover:opacity-100 whitespace-nowrap z-50 pointer-events-none">${key.toUpperCase()}</div></div>`,
                        iconSize: [48, 48]
                     });
                     L.marker(val, {icon}).addTo(map).on('click', () => onSectorSelect(key));
                });
                
                setTimeout(() => map.invalidateSize(), 500);

                return () => map.remove();
            }, []);

            return <div ref={mapRef} className="w-full h-full bg-[#111] z-0 min-h-[50vh] md:min-h-full rounded-lg overflow-hidden border border-gray-800" />;
        };

        const LeadModal = ({ pkg, onClose, onSubmit }) => {
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/90 p-4">
                    <div className="w-full max-w-md bg-panel border-2 border-neon-cyan p-6 shadow-[0_0_50px_rgba(0,240,255,0.2)]">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="font-hud text-xl text-white">CLEARANCE PROTOCOL</h2>
                            <div className="w-2 h-2 bg-neon-cyan rounded-full animate-ping"></div>
                        </div>
                        <div className="mb-6 p-4 border border-dashed border-gray-700 bg-black/50 flex gap-4">
                             <div className="text-4xl text-gray-700">?</div>
                             <div>
                                 <div className="text-[9px] font-mono text-neon-gold">TARGET</div>
                                 <div className="font-hud text-white">{pkg.codename}</div>
                             </div>
                        </div>
                        <form onSubmit={(e) => { e.preventDefault(); onSubmit(); }} className="space-y-4">
                            <input type="text" placeholder="AGENT ID" className="w-full bg-black border border-gray-700 p-3 text-white font-mono text-xs focus:border-neon-cyan outline-none" required />
                            <input type="email" placeholder="SECURE UPLINK (EMAIL)" className="w-full bg-black border border-gray-700 p-3 text-white font-mono text-xs focus:border-neon-cyan outline-none" required />
                            <button type="submit" className="w-full py-4 bg-neon-cyan text-black font-black font-hud tracking-widest hover:bg-white shadow-[0_0_20px_rgba(0,240,255,0.4)] transition-all">GRANT CLEARANCE</button>
                        </form>
                        <button onClick={onClose} className="w-full mt-4 text-[10px] text-gray-500 font-mono hover:text-white">ABORT MISSION</button>
                    </div>
                </div>
            )
        };

        const DealModal = ({ onClose, onUnlock }) => {
            const [step, setStep] = useState(1);
            const [sector, setSector] = useState("");
            const [vibe, setVibe] = useState("");
            
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/95 p-4">
                    <div className="w-full max-w-lg bg-panel border-2 border-neon-gold p-8 relative overflow-hidden">
                        <div className="flex justify-between items-center mb-8">
                            <h2 className="font-hud text-xl text-neon-gold">TACTICAL WIZARD // PHASE {step}</h2>
                            <div className="font-mono text-xs text-neon-cyan">0{step}/02</div>
                        </div>

                        {step === 1 && (
                            <div className="space-y-6 animate-fade-in-up">
                                <div>
                                    <label className="block text-xs font-mono text-gray-500 mb-2">TARGET SECTOR</label>
                                    <select onChange={e => setSector(e.target.value)} className="w-full bg-black border border-gray-700 p-3 text-white font-mono focus:border-neon-gold outline-none">
                                        <option value="">-- SELECT --</option>
                                        {SECTORS.map(s => <option key={s} value={s}>{s.toUpperCase()}</option>)}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-mono text-gray-500 mb-2">MODE</label>
                                    <div className="grid grid-cols-2 gap-2">
                                        {['CHILL', 'PARTY', 'ADVENTURE', 'CULTURE'].map(v => (
                                            <button key={v} onClick={() => setVibe(v)} className={`p-3 border text-xs font-mono text-left ${vibe === v ? 'border-neon-cyan text-neon-cyan bg-neon-cyan/10' : 'border-gray-700 text-gray-500'}`}>{v}</button>
                                        ))}
                                    </div>
                                </div>
                                <button disabled={!sector || !vibe} onClick={() => setStep(2)} className="w-full py-4 bg-neon-gold text-black font-bold font-hud tracking-widest disabled:opacity-50">CONFIRM PROTOCOLS »</button>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="space-y-6 animate-fade-in-up">
                                <div className="p-4 bg-black/50 border-l-2 border-neon-red">
                                    <div className="text-neon-red font-hud text-sm mb-1">⚠ DECRYPTION KEY REQUIRED</div>
                                    <p className="text-gray-500 font-mono text-xs">Matching assets found. Enter uplink to decrypt.</p>
                                </div>
                                <form onSubmit={(e) => { e.preventDefault(); onUnlock(); }} className="space-y-4">
                                    <input type="email" placeholder="ENTER UPLINK (EMAIL)" className="w-full bg-black border border-gray-700 p-4 text-center text-white font-mono tracking-widest focus:border-neon-red outline-none" required />
                                    <button type="submit" className="w-full py-4 bg-neon-red text-white font-bold font-hud tracking-widest hover:bg-white hover:text-black shadow-[0_0_20px_rgba(255,0,0,0.5)]">DECRYPT RESULTS</button>
                                </form>
                            </div>
                        )}
                        <button onClick={onClose} className="absolute top-4 right-4 text-gray-600 font-mono">[X]</button>
                    </div>
                </div>
            )
        };

        const ConsoleLog = ({ logs, isOpen }) => (
             <div className={`fixed bottom-4 right-4 w-80 h-48 bg-black/90 border border-neon-cyan p-2 font-mono text-[10px] z-50 transition-all ${isOpen ? 'opacity-100 pointer-events-auto' : 'opacity-0 pointer-events-none translate-y-4'}`}>
                 <div className="h-full overflow-y-auto custom-scrollbar">
                     {logs.map((l, i) => <div key={i} className="mb-1 text-neon-cyan">>{l}</div>)}
                 </div>
             </div>
        );

        // --- MAIN APP ---
        const App = () => {
            const [view, setView] = useState('map');
            const [booted, setBooted] = useState(false);
            const [clearance, setClearance] = useState('RECRUIT');
            const [showDeal, setShowDeal] = useState(false);
            const [showLead, setShowLead] = useState(false);
            const [selectedPkg, setSelectedPkg] = useState(null);
            const [logs, setLogs] = useState([]);
            const [consoleOpen, setConsoleOpen] = useState(false);

            const addLog = (msg) => setLogs(p => [...p.slice(-20), msg]);

            const handleUnlock = (pkg) => {
                audio.playSFX('click');
                setSelectedPkg(pkg);
                setShowLead(true);
            };

            const handleGrant = () => {
                audio.playSFX('success');
                setClearance('AGENT');
                setShowLead(false);
                setShowDeal(false);
                addLog('CLEARANCE GRANTED: AGENT LEVEL');
            };

            if (!booted) return <LoadingScreen onComplete={() => setBooted(true)} />;

            return (
                <div className="flex flex-col h-screen w-full relative overflow-hidden bg-void">
                    <div className="absolute inset-0 bg-grid-pattern opacity-10 pointer-events-none"></div>
                    
                    <Header clearance={clearance} />
                    
                    <div className="flex-1 flex overflow-hidden relative z-10">
                        <Sidebar 
                            active={view} 
                            onNav={(v) => { audio.playSFX('click'); setView(v); }}
                            onDeal={() => { audio.playSFX('click'); setShowDeal(true); }}
                            onConsole={() => { audio.playSFX('click'); setConsoleOpen(!consoleOpen); }}
                        />
                        
                        <main className="flex-1 relative overflow-y-auto p-4 md:p-8 scroll-smooth pb-24 md:pb-8">
                            {view === 'map' && (
                                <div className="h-full flex flex-col gap-4">
                                    <div>
                                        <h2 className="text-3xl md:text-5xl font-display font-bold text-white cyber-glitch" data-text="GLOBAL INTEL">GLOBAL INTEL</h2>
                                        <p className="text-xs font-mono text-neon-gold tracking-widest mt-2">SELECT DEPLOYMENT ZONE</p>
                                    </div>
                                    <div className="flex-1 border border-gray-800 rounded-lg overflow-hidden relative shadow-2xl">
                                        <IndiaMap onSectorSelect={(s) => { audio.playSFX('success'); setView(s); }} />
                                    </div>
                                </div>
                            )}
                            
                            {SECTORS.includes(view) && (
                                <PackageGrid 
                                    data={PACKAGES[view]} 
                                    onBook={(pkg) => { handleUnlock(pkg); }}
                                    clearance={clearance}
                                    onUnlock={handleUnlock}
                                />
                            )}
                        </main>
                    </div>

                    <MobileNav 
                        onNav={(v) => { audio.playSFX('click'); setView(v); }}
                        onDeal={() => { audio.playSFX('click'); setShowDeal(true); }}
                    />

                    <ConsoleLog logs={logs} isOpen={consoleOpen} />

                    {showDeal && <DealModal onClose={() => setShowDeal(false)} onUnlock={handleGrant} />}
                    {showLead && <LeadModal pkg={selectedPkg} onClose={() => setShowLead(false)} onSubmit={handleGrant} />}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
